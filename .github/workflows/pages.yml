name: Redaction public frontend
on:
  push:
    branches: [main]
    paths: [index.html, static/**, CNAME, .github/workflows/pages.yml, RELEASE_SOURCE]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: redaction-pages
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Validate release frontend
        run: |
          node --check static/app.js
          test "$(cat CNAME)" = redaction.suaveforge.com
          test -s RELEASE_SOURCE
      - name: Verify repository administrator has enabled Pages and bound the hostname
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/pages" >/tmp/redaction-pages.json
          jq -e '.build_type=="workflow" and .cname=="redaction.suaveforge.com"' /tmp/redaction-pages.json >/dev/null
      - uses: actions/configure-pages@v5
      - name: Stage static files only
        run: |
          mkdir -p /tmp/redaction-public
          cp -r index.html static CNAME .nojekyll RELEASE_SOURCE /tmp/redaction-public/
          if test -d video; then cp -r video /tmp/redaction-public/; fi
      - uses: actions/upload-pages-artifact@v3
        with:
          path: /tmp/redaction-public
      - id: deployment
        uses: actions/deploy-pages@v4
  dns:
    needs: publish
    runs-on: [self-hosted, Linux, X64, server123, suaveforge-deploy, suaveforge-org]
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Verify Pages hostname and product API before creating DNS
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          gh api "repos/$GITHUB_REPOSITORY/pages" --jq '.cname' | grep -Fxq redaction.suaveforge.com
          curl -fsS --max-time 15 https://api-redaction.suaveforge.com:19447/api/health | grep -q '"worker":true'
          bash scripts/configure-frontend-dns.sh
