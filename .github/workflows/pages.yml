name: Redaction public frontend
on:
  push:
    branches: [main]
    paths: [index.html, static/**, CNAME, .github/workflows/pages.yml, RELEASE_SOURCE]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: redaction-pages
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Validate release frontend
        run: |
          node --check static/app.js
          test "$(cat CNAME)" = redaction.suaveforge.com
          test -s RELEASE_SOURCE
      - name: Enable Pages if not yet configured
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh api "repos/$GITHUB_REPOSITORY/pages" >/tmp/pages.json 2>/dev/null; then
            gh api --method POST "repos/$GITHUB_REPOSITORY/pages" -f build_type=workflow
          fi
          gh api --method PUT "repos/$GITHUB_REPOSITORY/pages" -f build_type=workflow -f cname=redaction.suaveforge.com
      - uses: actions/configure-pages@v5
      - name: Stage static files only
        run: |
          mkdir -p /tmp/redaction-public
          cp -r index.html static CNAME .nojekyll RELEASE_SOURCE /tmp/redaction-public/
          if test -d video; then cp -r video /tmp/redaction-public/; fi
      - uses: actions/upload-pages-artifact@v3
        with:
          path: /tmp/redaction-public
      - id: deployment
        uses: actions/deploy-pages@v4
